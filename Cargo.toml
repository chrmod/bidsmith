[package]
name = "bidsmith"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Declarative, AI-friendly tooling for Google Ads campaigns"
repository = "https://github.com/chrmod/bidsmith"

[[bin]]
name = "bidsmith"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hcl-edit = "0.9"
miette = { version = "7.6", features = ["fancy"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
