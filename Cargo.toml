[package]
name = "bidsmith"
version = "0.8.0"
edition = "2021"
license = "MPL-2.0"
description = "Declarative, AI-friendly tooling for Google Ads campaigns"
repository = "https://github.com/chrmod/bidsmith"

[[bin]]
name = "bidsmith"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hcl-edit = "0.9"
miette = { version = "7.6", features = ["fancy"] }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[features]
e2e = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
